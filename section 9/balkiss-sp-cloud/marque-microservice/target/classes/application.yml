
spring:
  rabbitmq:
    host: "localhost"
    port: 5672
    username: "guest"
    password: "guest"

  profiles:
    active: default

  config:
    import: optional:configserver:${CONFIG_SERVICE_URL:http://localhost:9999}

  application:
    name: marque
  datasource:
    url: 'jdbc:h2:mem:depdb'
  h2:
    console:
      enabled: true

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update

  cloud:
    config:
      enabled: true
    discovery:
      enabled: true

server:
  port: 8085

eureka:
  instance:
    instance-id: ${HOSTNAME:${spring.application.name}}:${spring.application.name}:${server.port}
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: ${DISCOVERY_SERVICE_URL:http://localhost:8761/eureka}

management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    busrefresh:
      enabled: true