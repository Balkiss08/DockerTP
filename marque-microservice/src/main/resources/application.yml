server:
  port: 8085

spring:
  profiles:
    active: prof
  config:
    import: "optional:configserver:http://localhost:9999/"
  application:
    name: marque
  datasource:
    url: 'jdbc:h2:mem:depdb'
  h2:
    console:
      enabled: true
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
  cloud:
    config:
      enabled: false
    discovery:
      enabled: false

eureka:
  client:
    enabled: true
    service-url:
      defaultZone: 'http://localhost:8761/eureka/'

management:
  endpoints:
    web:
      exposure:
        include: '*'

build:
  version: 1.0

author:
  name: 'Balkiss BENMAJDOUBA [MARQUE]'
  email: 'benmajdoubab@gmail.com [MARQUE]'